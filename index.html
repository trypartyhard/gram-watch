<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Gram Watch — истёкшие .gram домены</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"
        integrity="sha384-ej0rYqvkb978ljOWDi1iAt5spb5B7sRdf1g8Hii30vS72XLjxoCPCmx5seE7s05g" crossorigin="anonymous"></script>
<script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"
        integrity="sha384-KZ9iM9JqTC8JCLaVPv/PkC5yCO2FJ4qykQ6jhXY565xW86rtPEZgqcLfEWMtqQmT" crossorigin="anonymous"></script>
<style>
  :root { --bg:#0e1116; --panel:#161b23; --panel2:#1b212c; --line:#232b37; --txt:#d7dee8; --dim:#8b97a8;
          --acc:#4ea1ff; --red:#ff6b6b; --yel:#ffd166; --grn:#7bd88f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.45 "Segoe UI",system-ui,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:12px 12px calc(40px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; gap:10px; justify-content:space-between; margin-bottom:10px; }
  header h1 { font-size:17px; margin:0; white-space:nowrap; }
  .sub { color:var(--dim); font-size:12px; margin:-6px 0 10px; }
  .tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 14px; cursor:pointer; user-select:none; }
  .tab.active { border-color:var(--acc); background:var(--panel2); }
  .tab b { display:block; font-size:18px; line-height:1.2; }
  .tab span { color:var(--dim); font-size:11px; }
  .tab.red b{color:var(--red)} .tab.yel b{color:var(--yel)} .tab.acc b{color:var(--acc)} .tab.grn b{color:var(--grn)}
  .bar { display:flex; gap:8px; margin-bottom:10px; }
  input[type=search] { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--txt); padding:10px 12px; font-size:15px; outline:none; min-width:0; }
  input[type=search]:focus { border-color:var(--acc); }
  select { background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--dim); padding:0 8px; font-size:13px; outline:none; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .row1 { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .dname { font-weight:700; font-size:16px; color:var(--txt); text-decoration:none; word-break:break-all; }
  .dname:hover { color:var(--acc); }
  .badge { font-size:12px; font-weight:600; white-space:nowrap; }
  .meta { color:var(--dim); font-size:12.5px; margin-top:3px; }
  .meta a { color:var(--dim); }
  .actions { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; }
  .price { font-size:13px; color:var(--dim); }
  .price b { color:var(--txt); }
  button.go { background:var(--acc); border:0; border-radius:10px; color:#06243f; font-weight:700; font-size:14px; padding:9px 14px; cursor:pointer; }
  button.go:active { transform:scale(.97); }
  button.more { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; color:var(--acc); font-size:14px; padding:12px; cursor:pointer; margin-top:4px; }
  .empty { padding:36px 0; text-align:center; color:var(--dim); }
  .d-red{color:var(--red)} .d-yel{color:var(--yel)} .d-grn{color:var(--grn)} .d-acc{color:var(--acc)}
  /* sheet */
  .ovl { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:50; }
  .sheet { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-radius:16px 16px 0 0; border-top:1px solid var(--line);
           padding:18px 16px calc(18px + env(safe-area-inset-bottom)); z-index:51; display:none; max-width:560px; margin:0 auto; }
  .sheet h2 { margin:0 0 4px; font-size:17px; }
  .sheet .note { color:var(--dim); font-size:12.5px; margin:8px 0; }
  .amt { display:flex; align-items:center; gap:8px; margin:12px 0; }
  .amt input { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:10px; color:var(--txt); padding:12px; font-size:18px; font-weight:700; outline:none; min-width:0; }
  .amt input:focus { border-color:var(--acc); }
  .amt span { color:var(--dim); font-weight:700; }
  .sheet button.go { width:100%; padding:13px; font-size:15px; }
  .err { color:var(--red); font-size:13px; min-height:18px; margin-bottom:6px; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom)); background:var(--panel2);
           border:1px solid var(--line); border-radius:12px; padding:11px 16px; font-size:14px; z-index:60; display:none; max-width:90%; }
  #tc-btn { flex:0 0 auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⌛ .gram домены</h1>
    <div id="tc-btn"></div>
  </header>
  <div class="sub" id="scanned">загрузка…</div>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="поиск по имени…">
    <select id="sort" style="display:none">
      <option value="expiry">старые → новые</option>
      <option value="len">короткие имена</option>
      <option value="name">по алфавиту</option>
    </select>
  </div>
  <div id="list"></div>
</div>

<div class="ovl" id="ovl" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <h2 id="sh-title"></h2>
  <div class="note" id="sh-sub"></div>
  <div class="amt"><input id="sh-amt" type="number" inputmode="numeric" min="0"><span>GRM</span></div>
  <div class="note">К транзакции прикладывается <b>1.35 TON</b> (1.25 TON — залог аукциона, излишек вернётся).
    GRM-ставка уйдёт на контракт домена; если тебя перебьют — GRM вернутся.</div>
  <div class="err" id="sh-err"></div>
  <button class="go" id="sh-go" onclick="confirmStart()">Отправить в кошелёк</button>
</div>
<div class="toast" id="toast"></div>

<script>
const GRM_MASTER = 'EQC47093oX5Xhb0xuk2lCr2RhS8rj-vul61u4W2UH5ORmG_O';
const OPEN_OP = 0x4ED14B65, JETTON_TRANSFER = 0x0f8a7ea5;
const FWD_TON = '1250000000', TOTAL_TON = '1350000000';
// минимальная стартовая цена: база по длине, -10%/30дн от 2024-03-22, после 21 периода — пол (floor)
const PRICE = { 1:[1e6,1e5], 2:[3e5,3e4], 3:[5e4,5e3], 4:[3e3,300], 5:[1e3,100], 6:[700,70], 7:[500,50], 8:[300,30], 9:[200,20] };
function minStartGram(name) {
  const [base, floor] = PRICE[name.length] || [100, 10];
  const periods = Math.floor((Date.now() / 1000 - 1711123200) / 2592000);
  if (periods > 21) return floor;
  let p = base;
  for (let i = 0; i < periods; i++) p = p * 0.9;
  return Math.max(Math.ceil(p), floor);
}

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0e1116'); tg.setBackgroundColor('#0e1116'); } catch (e) {} }

const tcui = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl: location.origin + location.pathname.replace(/index\.html$/, '').replace(/\/$/, '') + '/tonconnect-manifest.json',
  buttonRootId: 'tc-btn',
});

let D = null, tab = 'expired', query = '', shown = 120, sortMode = 'expiry', pending = null;
const $ = (id) => document.getElementById(id);
const fmt = (ts) => new Date(ts * 1000).toLocaleDateString('ru');
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = (a) => a ? a.slice(0, 5) + '…' + a.slice(-4) : '—';
const gramLink = (n) => `https://dns.gramcoin.org/#/${encodeURIComponent(n)}`;

function daysFrom(ts) { return Math.floor((D.scannedAt - ts) / 86400); }
function toast(msg, ms = 3500) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }

const TABS = {
  expired: { title: 'Истёкшие', cls: 'red' },
  soon:    { title: 'Истекают ≤30д', cls: 'yel' },
  auctions:{ title: 'Аукционы', cls: 'acc' },
  stuck:   { title: 'Застряли', cls: 'grn' },
};
function rowsOf(k) { return k === 'expired' ? D.expired : k === 'soon' ? D.expiringSoon : k === 'auctions' ? D.auctions : D.stuck; }

function render() {
  if (!D) return;
  $('tabs').innerHTML = Object.entries(TABS).map(([k, v]) =>
    `<div class="tab ${v.cls}${k === tab ? ' active' : ''}" onclick="setTab('${k}')"><b>${rowsOf(k).length}</b><span>${v.title}</span></div>`).join('');
  $('sort').style.display = tab === 'expired' ? '' : 'none';

  let rows = rowsOf(tab).filter((r) => !query || (r.name || '').includes(query));
  if (tab === 'expired') {
    if (sortMode === 'len') rows = [...rows].sort((a, b) => a.name.length - b.name.length || (a.name > b.name ? 1 : -1));
    else if (sortMode === 'name') rows = [...rows].sort((a, b) => a.name > b.name ? 1 : -1);
  }
  const total = rows.length;
  rows = rows.slice(0, shown);

  const html = rows.map((r, i) => {
    const name = esc(r.name);
    let badge = '', meta = '', action = '';
    if (tab === 'expired') {
      const d = daysFrom(r.expiry);
      badge = `<span class="badge ${d > 90 ? 'd-red' : 'd-yel'}">истёк ${d} дн. назад</span>`;
      meta = `до ${fmt(r.expiry)} · владел <a href="https://tonviewer.com/${r.owner}" target="_blank">${short(r.owner)}</a>`;
      action = `<div class="actions"><div class="price">старт от <b>${minStartGram(r.name).toLocaleString('ru')} GRM</b></div>
        <button class="go" onclick="openSheet(${i})">Запустить аукцион</button></div>`;
    } else if (tab === 'soon') {
      badge = `<span class="badge d-yel">осталось ${-daysFrom(r.expiry)} дн.</span>`;
      meta = `истекает ${fmt(r.expiry)} · владелец <a href="https://tonviewer.com/${r.owner}" target="_blank">${short(r.owner)}</a>`;
    } else if (tab === 'auctions') {
      const left = r.end - D.scannedAt;
      badge = `<span class="badge d-acc">${left > 86400 ? Math.floor(left / 86400) + ' дн.' : Math.max(1, Math.floor(left / 3600)) + ' ч.'} до конца</span>`;
      meta = `ставка <b>${r.bid.toLocaleString('ru')} GRM</b> · лидер <a href="https://tonviewer.com/${r.bidder}" target="_blank">${short(r.bidder)}</a> · до ${new Date(r.end * 1000).toLocaleString('ru')}`;
    } else {
      badge = `<span class="badge d-grn">ждёт доставки</span>`;
      meta = `аукцион кончился ${fmt(r.end)} · ставка ${r.bid.toLocaleString('ru')} GRM · победитель <a href="https://tonviewer.com/${r.bidder}" target="_blank">${short(r.bidder)}</a>`;
    }
    return `<div class="card"><div class="row1"><a class="dname" href="${gramLink(r.name)}" target="_blank">${name}.gram</a>${badge}</div>
      <div class="meta">${meta}</div>${action}</div>`;
  }).join('');

  $('list').innerHTML = (html || '<div class="empty">ничего не найдено</div>') +
    (total > shown ? `<button class="more" onclick="shown+=200;render()">показать ещё (${total - shown})</button>` : '');
  window._rows = rows;
}
function setTab(k) { tab = k; shown = 120; render(); window.scrollTo(0, 0); }
$('q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); shown = 120; render(); });
$('sort').addEventListener('change', (e) => { sortMode = e.target.value; shown = 120; render(); });

// ---------- запуск аукциона ----------
function openSheet(i) {
  pending = window._rows[i];
  const min = minStartGram(pending.name);
  $('sh-title').textContent = pending.name + '.gram';
  $('sh-sub').textContent = `Стартовая ставка — минимум ${min.toLocaleString('ru')} GRM. Аукцион идёт 7 дней, перебитие +5%.`;
  $('sh-amt').value = min; $('sh-amt').min = min;
  $('sh-err').textContent = '';
  $('ovl').style.display = 'block'; $('sheet').style.display = 'block';
}
function closeSheet() { $('ovl').style.display = 'none'; $('sheet').style.display = 'none'; pending = null; }

async function grmWalletOf(ownerRaw) {
  try {
    const j = await (await fetch(`https://tonapi.io/v2/accounts/${ownerRaw}/jettons/${GRM_MASTER}`)).json();
    if (j.wallet_address && j.wallet_address.address) return { jw: j.wallet_address.address, balance: Number(j.balance) / 1e9 };
  } catch (e) {}
  const m = await (await fetch(`https://tonapi.io/v2/blockchain/accounts/${GRM_MASTER}/methods/get_wallet_address?args=${encodeURIComponent(ownerRaw)}`)).json();
  if (m.success && m.decoded && m.decoded.jetton_wallet_address) return { jw: m.decoded.jetton_wallet_address, balance: 0 };
  throw new Error('не смог получить GRM-кошелёк');
}

async function confirmStart() {
  if (!pending) return;
  const err = $('sh-err'); err.textContent = '';
  const amt = Number($('sh-amt').value);
  const min = minStartGram(pending.name);
  if (!amt || amt < min) { err.textContent = `Минимум ${min.toLocaleString('ru')} GRM`; return; }
  if (!tcui.account) { closeSheet(); tcui.openModal(); return; }
  const btn = $('sh-go'); btn.disabled = true; btn.textContent = 'Готовлю транзакцию…';
  try {
    const { jw, balance } = await grmWalletOf(tcui.account.address);
    if (balance && balance < amt) { err.textContent = `На кошельке ${balance.toLocaleString('ru')} GRM — не хватает`; return; }
    const BN = TonWeb.utils.BN, Cell = TonWeb.boc.Cell;
    const fwd = new Cell(); fwd.bits.writeUint(OPEN_OP, 32);
    const body = new Cell();
    body.bits.writeUint(JETTON_TRANSFER, 32);
    body.bits.writeUint(0, 64);
    body.bits.writeCoins(new BN(BigInt(Math.round(amt * 1e9)).toString()));
    body.bits.writeAddress(new TonWeb.utils.Address(pending.address));
    body.bits.writeAddress(new TonWeb.utils.Address(tcui.account.address));
    body.bits.writeBit(0);
    body.bits.writeCoins(new BN(FWD_TON));
    body.bits.writeBit(1);
    body.refs.push(fwd);
    const boc = TonWeb.utils.bytesToBase64(await body.toBoc(false));
    await tcui.sendTransaction({
      validUntil: Math.floor(Date.now() / 1000) + 300,
      messages: [{ address: jw, amount: TOTAL_TON, payload: boc }],
    });
    closeSheet();
    toast('✅ Отправлено! Аукцион появится после подтверждения сети (~1 мин)', 5000);
  } catch (e) {
    err.textContent = e && e.message && e.message.includes('User') ? 'Отменено в кошельке' : 'Ошибка: ' + (e.message || e);
  } finally {
    btn.disabled = false; btn.textContent = 'Отправить в кошелёк';
  }
}

// ---------- данные ----------
fetch('data.json?t=' + Math.floor(Date.now() / 600000)).then((r) => r.json()).then((d) => {
  D = d;
  const age = Math.floor((Date.now() / 1000 - d.scannedAt) / 3600);
  $('scanned').textContent = `${d.total.toLocaleString('ru')} доменов · скан ${age < 1 ? 'меньше часа' : age + ' ч.'} назад · обновляется каждые 6 ч.`;
  render();
}).catch(() => { $('scanned').textContent = 'не удалось загрузить данные'; });
</script>
</body>
</html>

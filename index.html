<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Gram Watch — истёкшие .gram домены</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="icon.png">
<script src="https://telegram.org/js/telegram-web-app.js" async onload="window.initTg && initTg()"></script>
<script src="https://unpkg.com/@tonconnect/ui@3.0.0/dist/tonconnect-ui.min.js"
        integrity="sha384-KZJz/e4LItU3cVpBbZC7OpSw0USa3d7FGIfLGlXN/RXZAcIypYXvQ0Qb8I9J222K" crossorigin="anonymous"></script>
<script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"
        integrity="sha384-KZ9iM9JqTC8JCLaVPv/PkC5yCO2FJ4qykQ6jhXY565xW86rtPEZgqcLfEWMtqQmT" crossorigin="anonymous"></script>
<style>
  :root { --bg:#0e1116; --panel:#161b23; --panel2:#1b212c; --line:#232b37; --txt:#d7dee8; --dim:#8b97a8;
          --acc:#4ea1ff; --red:#ff6b6b; --yel:#ffd166; --grn:#7bd88f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.45 "Segoe UI",system-ui,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:12px 12px calc(40px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; gap:10px; justify-content:space-between; margin-bottom:10px; }
  header h1 { font-size:17px; margin:0; white-space:nowrap; }
  .sub { color:var(--dim); font-size:12px; margin:-6px 0 10px; }
  .tabs { display:flex; gap:5px; margin-bottom:8px; }
  .tab { flex:1 1 0; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:7px 4px; cursor:pointer; user-select:none; text-align:center; }
  .tab.active { border-color:var(--acc); background:var(--panel2); }
  .tab b { display:block; font-size:17px; line-height:1.2; }
  .tab span { color:var(--dim); font-size:10px; white-space:nowrap; }
  .tab.red b{color:var(--red)} .tab.yel b{color:var(--yel)} .tab.acc b{color:var(--acc)} .tab.grn b{color:var(--grn)}
  .bar { display:flex; gap:8px; margin-bottom:10px; }
  input[type=search] { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--txt); padding:10px 12px; font-size:15px; outline:none; min-width:0; }
  input[type=search]:focus { border-color:var(--acc); }
  select { background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--dim); padding:0 8px; font-size:13px; outline:none; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .row1 { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .dname { font-weight:700; font-size:16px; color:var(--txt); text-decoration:none; word-break:break-all; }
  .dname:hover { color:var(--acc); }
  .badge { font-size:12px; font-weight:600; white-space:nowrap; }
  .meta { color:var(--dim); font-size:12.5px; margin-top:3px; }
  .meta a { color:var(--dim); }
  .actions { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; }
  .price { font-size:13px; color:var(--dim); }
  .price b { color:var(--txt); }
  button.go { background:var(--acc); border:0; border-radius:10px; color:#06243f; font-weight:700; font-size:14px; padding:9px 14px; cursor:pointer; }
  button.go:active { transform:scale(.97); }
  button.more { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; color:var(--acc); font-size:14px; padding:12px; cursor:pointer; margin-top:4px; }
  .empty { padding:36px 0; text-align:center; color:var(--dim); }
  .d-red{color:var(--red)} .d-yel{color:var(--yel)} .d-grn{color:var(--grn)} .d-acc{color:var(--acc)}
  /* sheet */
  .ovl { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:50; }
  .sheet { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-radius:16px 16px 0 0; border-top:1px solid var(--line);
           padding:18px 16px calc(18px + env(safe-area-inset-bottom)); z-index:51; display:none; max-width:560px; margin:0 auto; }
  .sheet h2 { margin:0 0 4px; font-size:17px; }
  .sheet .note { color:var(--dim); font-size:12.5px; margin:8px 0; }
  .amt { display:flex; align-items:center; gap:8px; margin:12px 0; }
  .amt input { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:10px; color:var(--txt); padding:12px; font-size:18px; font-weight:700; outline:none; min-width:0; }
  .amt input:focus { border-color:var(--acc); }
  .amt span { color:var(--dim); font-weight:700; }
  .sheet button.go { width:100%; padding:13px; font-size:15px; }
  .err { color:var(--red); font-size:13px; min-height:18px; margin-bottom:6px; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom)); background:var(--panel2);
           border:1px solid var(--line); border-radius:12px; padding:11px 16px; font-size:14px; z-index:60; display:none; max-width:90%; }
  #tc-btn { flex:0 0 auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⌛ .gram домены</h1>
    <div id="tc-btn"></div>
  </header>
  <div class="sub" id="scanned">загрузка…</div>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="поиск по имени…">
    <select id="sort" style="display:none">
      <option value="expiry">старые → новые</option>
      <option value="len">короткие имена</option>
      <option value="name">по алфавиту</option>
    </select>
  </div>
  <div id="list"></div>
</div>

<div class="ovl" id="ovl" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <h2 id="sh-title"></h2>
  <div class="note" id="sh-sub"></div>
  <div class="amt"><input id="sh-amt" type="number" inputmode="decimal" step="any" min="0"><span>GRM</span></div>
  <div class="note" id="sh-note"></div>
  <div class="err" id="sh-err"></div>
  <button class="go" id="sh-go" onclick="sheetConfirm()">Запустить</button>
</div>
<div class="toast" id="toast"></div>

<script>
const GRM_MASTER = 'EQC47093oX5Xhb0xuk2lCr2RhS8rj-vul61u4W2UH5ORmG_O';
const OPEN_OP = 0x4ED14B65, JETTON_TRANSFER = 0x0f8a7ea5;
const FWD_TON = '1250000000', TOTAL_TON = '1350000000';
const FEE_WALLET = 'UQBGMYvNRHVZMNqvU3zFYTMRM3svc_KYOOBbdUrBC_AoGdmk';
const FEE_GRM = 100, FEE_MSG_TON = '50000000';
// минимальная стартовая цена: база по длине, -10%/30дн от 2024-03-22, после 21 периода — пол (floor)
const PRICE = { 1:[1e6,1e5], 2:[3e5,3e4], 3:[5e4,5e3], 4:[3e3,300], 5:[1e3,100], 6:[700,70], 7:[500,50], 8:[300,30], 9:[200,20] };
function minStartGram(name) {
  const [base, floor] = PRICE[name.length] || [100, 10];
  const periods = Math.floor((Date.now() / 1000 - 1711123200) / 2592000);
  if (periods > 21) return floor;
  let p = base;
  for (let i = 0; i < periods; i++) p = p * 0.9;
  return Math.max(Math.ceil(p), floor);
}

window.initTg = function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0e1116'); tg.setBackgroundColor('#0e1116'); } catch (e) {} }
};
initTg();

const tcui = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl: location.origin + location.pathname.replace(/index\.html$/, '').replace(/\/$/, '') + '/tonconnect-manifest.json',
  buttonRootId: 'tc-btn',
});

let D = null, tab = 'expired', query = '', shown = 120, sortMode = 'expiry', pending = null;
const $ = (id) => document.getElementById(id);
const fmt = (ts) => new Date(ts * 1000).toLocaleDateString('ru');
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = (a) => a ? a.slice(0, 5) + '…' + a.slice(-4) : '—';
const gramLink = (n) => `https://dns.gramcoin.org/#/${encodeURIComponent(n)}`;

function daysFrom(ts) { return Math.floor((D.scannedAt - ts) / 86400); }
function toast(msg, ms = 3500) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }

const TABS = {
  expired: { title: 'Истёкшие', cls: 'red' },
  soon:    { title: 'Истекают', cls: 'yel' },
  auctions:{ title: 'Аукционы', cls: 'acc' },
  stuck:   { title: 'Застряли', cls: 'grn' },
};
function rowsOf(k) { return k === 'expired' ? D.expired : k === 'soon' ? D.expiringSoon : k === 'auctions' ? D.auctions : D.stuck; }

function render() {
  if (!D) return;
  $('tabs').innerHTML = Object.entries(TABS).map(([k, v]) =>
    `<div class="tab ${v.cls}${k === tab ? ' active' : ''}" onclick="setTab('${k}')"><b>${rowsOf(k).length}</b><span>${v.title}</span></div>`).join('');
  $('sort').style.display = tab === 'expired' ? '' : 'none';

  let rows = rowsOf(tab).filter((r) => !query || (r.name || '').includes(query));
  if (tab === 'expired') {
    if (sortMode === 'len') rows = [...rows].sort((a, b) => a.name.length - b.name.length || (a.name > b.name ? 1 : -1));
    else if (sortMode === 'name') rows = [...rows].sort((a, b) => a.name > b.name ? 1 : -1);
  }
  const total = rows.length;
  rows = rows.slice(0, shown);

  const html = rows.map((r, i) => {
    const name = esc(r.name);
    let badge = '', meta = '', action = '';
    if (tab === 'expired') {
      const d = daysFrom(r.expiry);
      badge = `<span class="badge ${d > 90 ? 'd-red' : 'd-yel'}">истёк ${d} дн. назад</span>`;
      meta = `до ${fmt(r.expiry)} · владел <a href="https://tonviewer.com/${r.owner}" target="_blank">${short(r.owner)}</a>`;
      action = `<div class="actions"><div class="price">старт от <b>${minStartGram(r.name).toLocaleString('ru')} GRM</b></div>
        <button class="go" onclick="openSheet(${i})">Запустить аукцион</button></div>`;
    } else if (tab === 'soon') {
      badge = `<span class="badge d-yel">осталось ${-daysFrom(r.expiry)} дн.</span>`;
      meta = `истекает ${fmt(r.expiry)} · владелец <a href="https://tonviewer.com/${r.owner}" target="_blank">${short(r.owner)}</a>`;
    } else if (tab === 'auctions') {
      badge = `<span class="badge d-acc" data-end="${r.end}"></span>`;
      meta = `ставка <b>${r.bid.toLocaleString('ru')} GRM</b> · лидер <a href="https://tonviewer.com/${r.bidder}" target="_blank">${short(r.bidder)}</a> · до ${new Date(r.end * 1000).toLocaleString('ru')}`;
      action = `<div class="actions"><div class="price">перебить от <b>${nextBidGram(r.bid).toLocaleString('ru')} GRM</b></div>
        <button class="go" onclick="openBidSheet(${i})">Сделать ставку</button></div>`;
    } else {
      badge = `<span class="badge d-grn">ждёт доставки</span>`;
      meta = `аукцион кончился ${fmt(r.end)} · ставка ${r.bid.toLocaleString('ru')} GRM · победитель <a href="https://tonviewer.com/${r.bidder}" target="_blank">${short(r.bidder)}</a>`;
    }
    return `<div class="card"><div class="row1"><a class="dname" href="${gramLink(r.name)}" target="_blank">${name}.gram</a>${badge}</div>
      <div class="meta">${meta}</div>${action}</div>`;
  }).join('');

  $('list').innerHTML = (html || '<div class="empty">ничего не найдено</div>') +
    (total > shown ? `<button class="more" onclick="shown+=200;render()">показать ещё (${total - shown})</button>` : '');
  window._rows = rows;
  tickCountdowns();
}

// живой обратный отсчёт на вкладке аукционов
function fmtLeft(s) {
  if (s <= 0) return 'завершён';
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return `${d}д ${h}ч до конца`;
  if (h > 0) return `${h}ч ${m}м до конца`;
  return `${m}м ${s % 60}с до конца`;
}
function tickCountdowns() {
  const now = Math.floor(Date.now() / 1000);
  document.querySelectorAll('[data-end]').forEach((el) => {
    const left = Number(el.dataset.end) - now;
    el.textContent = fmtLeft(left);
    if (left <= 0) el.classList.replace('d-acc', 'd-grn');
  });
}
setInterval(tickCountdowns, 1000);
function setTab(k) { tab = k; shown = 120; render(); window.scrollTo(0, 0); }
$('q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); shown = 120; render(); });
$('sort').addEventListener('change', (e) => { sortMode = e.target.value; shown = 120; render(); });

// ---------- шторка: запуск аукциона / ставка ----------
let sheetMode = 'start', bidCtx = null;
const FEE_NOTE = 'Итого спишется: <b>ставка + 100 GRM</b> (комиссия сервиса) и <b>~1.4 TON</b> (1.25 TON — залог, излишек вернётся). Если тебя перебьют — GRM-ставка вернётся на кошелёк.';

function nextBidNano(bidGram) { return (BigInt(Math.round(bidGram * 1e9)) * 105n + 99n) / 100n; }
function nextBidGram(bidGram) { return Math.ceil(Number(nextBidNano(bidGram)) / 1e6) / 1000; }

function showSheet() {
  $('sh-err').textContent = ''; $('sh-go').disabled = false;
  $('ovl').style.display = 'block'; $('sheet').style.display = 'block';
}
function closeSheet() { $('ovl').style.display = 'none'; $('sheet').style.display = 'none'; pending = null; bidCtx = null; }
function sheetConfirm() { return sheetMode === 'bid' ? confirmBid() : confirmStart(); }

function openSheet(i) {
  sheetMode = 'start';
  pending = window._rows[i];
  const min = minStartGram(pending.name);
  $('sh-title').textContent = pending.name + '.gram';
  $('sh-sub').textContent = `Стартовая ставка — минимум ${min.toLocaleString('ru')} GRM. Аукцион идёт 7 дней, перебитие +5%.`;
  $('sh-note').innerHTML = FEE_NOTE;
  $('sh-amt').value = min; $('sh-amt').min = min;
  $('sh-go').textContent = 'Запустить';
  showSheet();
}

async function openBidSheet(i) {
  sheetMode = 'bid';
  pending = window._rows[i];
  bidCtx = null;
  $('sh-title').textContent = pending.name + '.gram';
  $('sh-sub').textContent = 'Проверяю текущую ставку…';
  $('sh-note').innerHTML = FEE_NOTE;
  $('sh-amt').value = nextBidGram(pending.bid);
  $('sh-go').textContent = 'Перебить';
  showSheet();
  try {
    // живое состояние аукциона: каталог мог отстать, кто-то мог перебить только что
    const j = await (await fetch(`https://toncenter.com/api/v3/accountStates?address=${pending.address}&include_boc=true`)).json();
    const p = parseItemLive(j.accounts[0].data_boc);
    const now = Math.floor(Date.now() / 1000);
    if (!p.auction) { $('sh-sub').textContent = 'Аукцион уже завершён — домен доставлен победителю или продлён.'; $('sh-go').disabled = true; return; }
    if (p.auction.end < now) { $('sh-sub').textContent = 'Аукцион завершён и ждёт доставки победителю — ставки больше не принимаются.'; $('sh-go').disabled = true; return; }
    bidCtx = p.auction;
    const minNext = nextBidGram(p.auction.bid);
    $('sh-sub').innerHTML = `Текущая ставка: <b>${p.auction.bid.toLocaleString('ru')} GRM</b> — ` +
      (p.auction.bidder ? `<a href="https://tonviewer.com/${p.auction.bidder}" target="_blank">${short(p.auction.bidder)}</a>` : 'аноним') +
      `. Перебить: от <b>${minNext.toLocaleString('ru')} GRM</b> (+5%).`;
    $('sh-amt').value = minNext; $('sh-amt').min = minNext;
  } catch (e) {
    // сеть недоступна — работаем по данным каталога, контракт всё равно проверит сам
    bidCtx = { bid: pending.bid, end: pending.end, bidder: pending.bidder };
    $('sh-sub').textContent = `Текущая ставка (по каталогу): ${pending.bid.toLocaleString('ru')} GRM. Перебить: от ${nextBidGram(pending.bid).toLocaleString('ru')} GRM.`;
  }
}

async function grmWalletOf(ownerRaw) {
  // 1) toncenter — доступен из РФ (tonapi у части операторов заблокирован)
  try {
    const j = await (await fetch(`https://toncenter.com/api/v3/jetton/wallets?owner_address=${ownerRaw}&jetton_address=${GRM_MASTER}`)).json();
    const w = j.jetton_wallets && j.jetton_wallets[0];
    if (w && w.address) return { jw: w.address.toLowerCase(), balance: Number(w.balance) / 1e9 };
  } catch (e) {}
  // 2) tonapi: баланс юзера
  try {
    const j = await (await fetch(`https://tonapi.io/v2/accounts/${ownerRaw}/jettons/${GRM_MASTER}`)).json();
    if (j.wallet_address && j.wallet_address.address) return { jw: j.wallet_address.address, balance: Number(j.balance) / 1e9 };
  } catch (e) {}
  // 3) tonapi: расчёт адреса через get-метод мастера
  try {
    const m = await (await fetch(`https://tonapi.io/v2/blockchain/accounts/${GRM_MASTER}/methods/get_wallet_address?args=${encodeURIComponent(ownerRaw)}`)).json();
    if (m.success && m.decoded && m.decoded.jetton_wallet_address) return { jw: m.decoded.jetton_wallet_address, balance: 0 };
  } catch (e) {}
  throw new Error('не смог получить GRM-кошелёк — проверь, что на кошельке есть GRM');
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function runGet(address, method, attempt = 0) {
  const r = await fetch('https://toncenter.com/api/v2/runGetMethod', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ address, method, stack: [] }),
  });
  if (r.status === 429 && attempt < 2) { await sleep(1300); return runGet(address, method, attempt + 1); }
  const j = await r.json();
  if (!j.ok || j.result.exit_code !== 0) throw new Error('runGetMethod failed');
  return j.result.stack;
}

// живая проверка перед отправкой: данные каталога могут отставать до 6 часов
async function checkStillExpired(address) {
  const now = Math.floor(Date.now() / 1000);
  const fill = parseInt((await runGet(address, 'get_last_fill_up_time'))[0][1], 16);
  if (fill + 31622400 > now) return 'Домен уже занят: владелец продлил его или его только что купили на аукционе. Список обновится при следующем скане.';
  await sleep(1100); // toncenter free tier: 1 rps
  const end = parseInt((await runGet(address, 'get_auction_info'))[2][1], 16);
  if (end > 0) return end > now
    ? 'На этот домен уже идёт аукцион — кто-то успел раньше. Сделать ставку можно на dns.gramcoin.org.'
    : 'Аукцион на этот домен уже прошёл и ждёт доставки победителю.';
  return null;
}

function buildJettonTransfer(grmNano, toAddr, fwdPayloadCell) {
  const BN = TonWeb.utils.BN;
  const c = new TonWeb.boc.Cell();
  c.bits.writeUint(JETTON_TRANSFER, 32);
  c.bits.writeUint(0, 64);
  c.bits.writeCoins(new BN(grmNano.toString()));
  c.bits.writeAddress(new TonWeb.utils.Address(toAddr));
  c.bits.writeAddress(new TonWeb.utils.Address(tcui.account.address));
  c.bits.writeBit(0);
  c.bits.writeCoins(new BN(fwdPayloadCell ? FWD_TON : '0'));
  if (fwdPayloadCell) { c.bits.writeBit(1); c.refs.push(fwdPayloadCell); } else { c.bits.writeBit(0); }
  return c;
}

async function submitWithFee(jw, mainBody) {
  const feeBody = buildJettonTransfer(BigInt(FEE_GRM) * 1000000000n, FEE_WALLET, null);
  // TON Connect v3: messages[].address обязан быть в friendly-формате (raw 0:… отклоняется валидацией)
  const jwFriendly = new TonWeb.utils.Address(jw).toString(true, true, true);
  await tcui.sendTransaction({
    validUntil: Math.floor(Date.now() / 1000) + 300,
    messages: [
      { address: jwFriendly, amount: TOTAL_TON, payload: TonWeb.utils.bytesToBase64(await mainBody.toBoc(false)) },
      { address: jwFriendly, amount: FEE_MSG_TON, payload: TonWeb.utils.bytesToBase64(await feeBody.toBoc(false)) },
    ],
  });
}

async function confirmBid() {
  if (!pending || !bidCtx) return;
  const err = $('sh-err'); err.textContent = '';
  const amt = Number($('sh-amt').value);
  const amtNano = BigInt(Math.round((amt || 0) * 1e9));
  if (!amt || amtNano < nextBidNano(bidCtx.bid)) { err.textContent = `Минимум ${nextBidGram(bidCtx.bid).toLocaleString('ru')} GRM (+5% к текущей)`; return; }
  if (!tcui.account) { closeSheet(); tcui.openModal(); return; }
  const btn = $('sh-go'); btn.disabled = true; btn.textContent = 'Готовлю транзакцию…';
  try {
    const { jw, balance } = await grmWalletOf(tcui.account.address);
    if (balance && balance < amt + FEE_GRM) { err.textContent = `Нужно ${(amt + FEE_GRM).toLocaleString('ru')} GRM (ставка + комиссия), на кошельке ${balance.toLocaleString('ru')}`; return; }
    // ставка = GRM на контракт домена, forward-комментарий = имя домена (как на dns.gramcoin.org)
    const fwd = new TonWeb.boc.Cell();
    fwd.bits.writeUint(0, 32);
    fwd.bits.writeString(pending.name);
    const bidBody = buildJettonTransfer(amtNano, pending.address, fwd);
    await submitWithFee(jw, bidBody);
    const row = D.auctions.find((r) => r.address === pending.address);
    if (row) {
      row.bid = amt; row.bidder = tcui.account.address;
      const now = Math.floor(Date.now() / 1000);
      if (row.end - now < 3600) row.end = now + 3600; // антиснайп-продление
    }
    setTimeout(liveRefreshAuctions, 20000);
    closeSheet(); render();
    toast('✅ Ставка отправлена! Обновится после подтверждения сети (~1 мин)', 5000);
  } catch (e) {
    err.textContent = e && e.message && e.message.includes('User') ? 'Отменено в кошельке' : 'Ошибка: ' + (e.message || e);
  } finally {
    btn.disabled = false; btn.textContent = 'Перебить';
  }
}

async function confirmStart() {
  if (!pending) return;
  const err = $('sh-err'); err.textContent = '';
  const amt = Number($('sh-amt').value);
  const min = minStartGram(pending.name);
  if (!amt || amt < min) { err.textContent = `Минимум ${min.toLocaleString('ru')} GRM`; return; }
  if (!tcui.account) { closeSheet(); tcui.openModal(); return; }
  const btn = $('sh-go'); btn.disabled = true; btn.textContent = 'Проверяю домен…';
  try {
    try {
      const blocked = await checkStillExpired(pending.address);
      if (blocked) { err.textContent = blocked; return; }
    } catch (e) { /* проверка недоступна — не блокируем, контракт вернёт GRM сам */ }
    btn.textContent = 'Готовлю транзакцию…';
    const { jw, balance } = await grmWalletOf(tcui.account.address);
    if (balance && balance < amt + FEE_GRM) { err.textContent = `Нужно ${(amt + FEE_GRM).toLocaleString('ru')} GRM (ставка + комиссия), на кошельке ${balance.toLocaleString('ru')}`; return; }
    const fwd = new TonWeb.boc.Cell(); fwd.bits.writeUint(OPEN_OP, 32);
    const bidBody = buildJettonTransfer(BigInt(Math.round(amt * 1e9)), pending.address, fwd);
    await submitWithFee(jw, bidBody);
    // оптимистично: домен сразу переезжает из «Истёкших» в «Аукционы»
    const idx = D.expired.indexOf(pending);
    if (idx >= 0) D.expired.splice(idx, 1);
    D.auctions.unshift({ ...pending, bid: amt, bidder: tcui.account.address, end: Math.floor(Date.now() / 1000) + 7 * 86400 });
    setTimeout(liveRefreshAuctions, 20000); // подтянуть реальное состояние из сети
    closeSheet();
    render();
    toast('✅ Отправлено! Аукцион появится после подтверждения сети (~1 мин)', 5000);
  } catch (e) {
    err.textContent = e && e.message && e.message.includes('User') ? 'Отменено в кошельке' : 'Ошибка: ' + (e.message || e);
  } finally {
    btn.disabled = false; btn.textContent = 'Запустить';
  }
}

// ---------- живое обновление аукционов (каждые 90 c, прямо из блокчейна) ----------
function cellReader(cell) {
  let p = 0; const bs = cell.bits;
  return {
    u(n) { let v = 0n; for (let i = 0; i < n; i++) v = (v << 1n) | (bs.get(p++) ? 1n : 0n); return Number(v); },
    skipAddr() { const t = this.u(2); if (t === 2) { this.u(265); } return t; },
  };
}
function parseItemLive(b64) {
  const cell = TonWeb.boc.Cell.oneFromBoc(TonWeb.utils.base64ToBytes(b64));
  const r = cellReader(cell);
  r.u(256); r.skipAddr();
  const hasOwner = r.skipAddr() === 2;
  const hasAuction = r.u(1) === 1;
  const lastFillUp = r.u(64);
  let auction = null;
  if (hasAuction) {
    const a = cellReader(cell.refs[2]);
    let bidder = null;
    if (a.u(2) === 2) {
      a.u(1); // anycast none
      const wc = a.u(8);
      let hash = '';
      for (let i = 0; i < 32; i++) hash += a.u(8).toString(16).padStart(2, '0');
      bidder = (wc === 255 ? -1 : wc) + ':' + hash;
    }
    const bid = a.u(a.u(4) * 8) / 1e9;
    auction = { bid, end: a.u(64), bidder };
  }
  return { hasOwner, lastFillUp, auction };
}

let liveBusy = false;
async function liveRefreshAuctions() {
  if (!D || liveBusy) return;
  liveBusy = true;
  try {
    const targets = [...D.auctions, ...D.stuck];
    if (!targets.length) return;
    const states = {};
    for (let i = 0; i < targets.length; i += 100) {
      const chunk = targets.slice(i, i + 100);
      try {
        const j = await (await fetch(`https://toncenter.com/api/v3/accountStates?address=${chunk.map((t) => t.address).join(',')}&include_boc=true&limit=100`)).json();
        for (const acc of j.accounts || []) states[acc.address.toLowerCase()] = acc;
      } catch (e) {}
      if (i + 100 < targets.length) await sleep(1200);
    }
    const now = Math.floor(Date.now() / 1000);
    const auctions = [], stuck = [];
    let changed = false;
    for (const t of targets) {
      const raw = new TonWeb.utils.Address(t.address).toString(false).toLowerCase();
      const acc = states[raw];
      if (!acc || !acc.data_boc) { (t.end > now ? auctions : stuck).push(t); continue; }
      let p;
      try { p = parseItemLive(acc.data_boc); } catch (e) { (t.end > now ? auctions : stuck).push(t); continue; }
      if (p.auction) {
        if (p.auction.bid !== t.bid || p.auction.end !== t.end) changed = true;
        const u = { ...t, bid: p.auction.bid, end: p.auction.end };
        (u.end > now ? auctions : stuck).push(u);
      } else {
        changed = true; // аукцион исчез: домен доставлен победителю или продлён
      }
    }
    if (changed || auctions.length !== D.auctions.length || stuck.length !== D.stuck.length) {
      auctions.sort((a, b) => a.end - b.end);
      D.auctions = auctions; D.stuck = stuck;
      if (tab === 'auctions' || tab === 'stuck') render(); else if (D) render();
    }
  } finally {
    liveBusy = false;
  }
}
setInterval(liveRefreshAuctions, 90000);

// ---------- данные ----------
fetch('data.json?t=' + Math.floor(Date.now() / 600000)).then((r) => r.json()).then((d) => {
  D = d;
  const ageMin = Math.floor((Date.now() / 1000 - d.scannedAt) / 60);
  $('scanned').textContent = `${d.total.toLocaleString('ru')} доменов · каталог: ${ageMin < 60 ? ageMin + ' мин назад' : Math.floor(ageMin / 60) + ' ч. назад'} · аукционы: live`;
  render();
  liveRefreshAuctions();
}).catch(() => { $('scanned').textContent = 'не удалось загрузить данные'; });

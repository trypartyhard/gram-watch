const tcui = new TON_CONNECT_UI.TonConnectUI({
  manifestUrl: 'https://trypartyhard.github.io/gram-watch/tonconnect-manifest.json',
  buttonRootId: 'tc-btn',
});
const send = document.getElementById('send');
const status = document.getElementById('status');
function friendly(address) {
  return new TonWeb.utils.Address(address).toString(true, true, true);
}
tcui.onStatusChange((account) => {
  if (!account) {
    send.disabled = true;
    status.className = 'status';
    status.textContent = 'Сначала подключите кошелёк-владелец.';
    return;
  }
  const isOwner = friendly(account.address) === OWNER;
  send.disabled = !isOwner;
  status.className = isOwner ? 'status ok' : 'status err';
  status.textContent = isOwner
    ? 'Кошелёк-владелец подтверждён. Можно отправлять.'
    : 'Подключён другой кошелёк. Нужен владелец: ' + OWNER;
});
send.addEventListener('click', async () => {
  if (!tcui.account || friendly(tcui.account.address) !== OWNER) return;
  send.disabled = true;
  status.className = 'status';
  status.textContent = 'Откройте кошелёк и проверьте транзакцию…';
  try {
    await tcui.sendTransaction({
      validUntil: Math.floor(Date.now() / 1000) + 300,
      messages: [{ address: ITEM, amount: '10000000', payload: PAYLOAD }],
    });
    status.className = 'status ok';
    status.textContent = 'Транзакция отправлена. Теперь дождитесь подтверждения сети.';
  } catch (error) {
    send.disabled = false;
    status.className = 'status err';
    status.textContent = /reject|cancel|user/i.test(error && error.message || '')
      ? 'Подпись отменена в кошельке.'
      : 'Ошибка: ' + (error && error.message || error);
  }
});
</script>

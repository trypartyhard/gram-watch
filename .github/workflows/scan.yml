name: scan
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: scan
      - run: node scan/scan.cjs
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
      - name: commit data
        run: |
          git config user.name "gram-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet data.json; then
            git add data.json
            git commit -m "data: rescan $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "no changes"
          fi
